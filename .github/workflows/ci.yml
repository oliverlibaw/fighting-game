name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: DUMMY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache U2Net model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: ${{ runner.os }}-u2net-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-u2net-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -c constraints.txt
          pip install onnxruntime || true

      - name: Run integration smoke test
        env:
          PYTHONPATH: .
        run: |
          python -u tests/integration_smoke.py
